services:
  api:
    command: ["node", "--watch", "src/server.js"]
    volumes:
      - ./api/src:/app/src
  db:
    ports:
      - "5432:5432"
  front:
    build:
      target: dev
    environment:
      API_URL: http://api:3000
    ports: !override
      - "5173:5173"
    volumes:
      - ./front/src:/app/src